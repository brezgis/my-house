    const I = GM.ISLAND, outlineAt = a => { const o = I.outline, n = o.length, t = ((a / (Math.PI * 2)) % 1 + 1) % 1 * n, i = Math.floor(t), f = t - i; const p0 = o[(i - 1 + n) % n], p1 = o[i % n], p2 = o[(i + 1) % n], p3 = o[(i + 2) % n]; return 0.5 * ((2 * p1) + (-p0 + p2) * f + (2 * p0 - 5 * p1 + 4 * p2 - p3) * f * f + (-p0 + 3 * p1 - 3 * p2 + p3) * f * f * f); };
    const w = new Walker(camera, document.createElement('div'), { colliders: B.colliders, surfaces: house.surfaces });
    w.rim = { x: I.x, z: I.z, r: I.r * 0.965, at: a => outlineAt(a) * 0.965 }; w.enabled = true; ctx.walker = w;
    const floors = [[-4, 1.6, -8.6, -1.6, D, 'porch'], [1.6, 6.8, -8.4, -3.0, D, 'cabin'], [6.8, 10.8, -9.2, -4.0, D, 'balcony']];
    const wrong = () => {
      const lx = w.pos.x - TX, lz = w.pos.z - TZ, y = w.pos.y;
      for (const f of floors) if (w.vy < -2 && lx > f[0] + 0.05 && lx < f[1] - 0.05 && lz > f[2] + 0.05 && lz < f[3] - 0.05 && y < f[4] - 0.5 && y > f[4] - 6) return `under the ${f[5]} at (${lx.toFixed(1)}, ${y.toFixed(1)}, ${lz.toFixed(1)})`;
      if (Math.hypot(w.pos.x - I.x, w.pos.z - I.z) > outlineAt(Math.atan2(w.pos.z - I.z, w.pos.x - I.x)) * 0.965 + 0.5 && y < D - 1) return `beyond the rim below the decks at (${lx.toFixed(1)}, ${y.toFixed(1)}, ${lz.toFixed(1)})`;

    };
    const go = (lx, lz, ey) => {
      const x = TX + lx, z = TZ + lz; let t = 0; w.keys.add('KeyW');
      while (t < 25 && Math.hypot(x - w.pos.x, z - w.pos.z) > 0.35) { w.yaw = Math.atan2(-(x - w.pos.x), -(z - w.pos.z)); w.update(1 / 60); t += 1 / 60; }

      const ok = Math.hypot(x - w.pos.x, z - w.pos.z) < 0.7 && (ey === undefined || Math.abs(w.pos.y - ey) < 0.3);
      if (!ok) fail(`could not get to (${lx}, ${lz})${ey === undefined ? '' : ' at ' + ey}: stopped at (${(w.pos.x - TX).toFixed(2)}, ${w.pos.y.toFixed(2)}, ${(w.pos.z - TZ).toFixed(2)})`);
    };
    const route = [[-2.8, -21, 0], [-2.8, -14], [-2.8, -9.4], [-2.6, -7.2, D], [0.4, -5.3, D], [2.2, -5.3, D], [3.6, -5.3, D], [5.6, -5.3, D], [7.4, -5.3, D], [8.6, -5.8, D], [10, -8.6, D], [10, -4.8, D], [8, -5.4, D],
      [5.6, -5.3, D], [2.6, -4, D], [2.6, -6, D], [0.4, -5.3, D], [-3.2, -6, D], [-3.2, -8, D], [-0.3, -7.8, D], [-2.8, -8, D], [-2.8, -12], [-2.8, -21, 0], [-2.8, -24, 0]];
    w.pos.set(TX - 2.8, 0, TZ - 24); const b0 = bad;
    for (const [x, z, y] of route) go(x, z, y);
    L.push(`the route: ${route.length} legs, up the stair, across the porch, through the cabin, out on the balcony and down: ${bad === b0 ? 'all reached' : (bad - b0) + ' not'}`);
    // into every rail, hard, jumping; then wandering at random
    const places = [[-2.5, -7.5, D], [0.5, -6.8, D], [4.2, -5.3, D], [5.8, -5.0, D], [8.8, -5.7, D], [10.2, -6.8, D], [-2.8, -14, 7.6], [-2.8, -10, 13]];
    let runs = 0, seconds = 0; const b1 = bad;
    const rnd2 = (() => { let s = 12345; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();
    for (const [px, pz, py] of places) for (let k = 0; k < 8; k++) {
      w.pos.set(TX + px, py, TZ + pz); w.grounded = true; w.vy = 0; w.yaw = k * Math.PI / 4; w.keys.clear(); w.keys.add('KeyW'); w.keys.add('ShiftLeft'); runs++;
      let why = ''; for (let i = 0; i < 180; i++) { if (i % 25 === 12 && w.grounded) { w.vy = 10.5; w.grounded = false; } w.update(1 / 60); why ||= wrong(); } seconds += 3;

    }
    for (let run = 0; run < 24; run++) {
      const [px, pz, py] = places[run % places.length]; w.pos.set(TX + px, py, TZ + pz); w.grounded = true; w.vy = 0; w.yaw = rnd2() * 6.28; w.keys.clear(); w.keys.add('KeyW'); if (rnd2() < 0.6) w.keys.add('ShiftLeft'); runs++;

      if (why) fail(`wandering from (${px}, ${pz}): ${why}`);
    }

    L.push(`pushing and wandering: ${runs} runs, ${seconds} s: ${bad === b1 ? 'never under a floor, never off the edge' : (bad - b1) + ' went wrong'}`);
    // the rides and the seats, run with the garden's own clock
    let clock = 0; const run = secs => { for (let i = 0; i < secs * 60; i++) { clock += 1 / 60; w.update(1 / 60); for (const f of ctx.animated) f(clock, 1 / 60); } };
    const find = re => ctx.interact.find(it => re.test(typeof it.label === 'function' ? it.label() : it.label ?? ''));
    const at = (lx, y, lz) => { w.pos.set(TX + lx, y, TZ + lz); w.grounded = true; w.vy = 0; w.seated = null; w.apply(); run(0.2); };
    const near = (lx, y, lz, tol = 1.5) => Math.hypot(w.pos.x - TX - lx, w.pos.y - y, w.pos.z - TZ - lz) < tol;
    // the stair at a walk (treehouseLife holds the walker to it: no faster, however she runs)
    { w.pos.set(TX - 2.8, 0, TZ - 21); w.grounded = true; w.vy = 0; w.seated = null; w.yaw = Math.PI; w.keys.add('KeyW'); let tt = 0; while (tt < 30 && w.pos.y < D - 0.05) { clock += 1 / 60; tt += 1 / 60; w.update(1 / 60); for (const f of ctx.animated) f(clock, 1 / 60); } w.keys.clear(); run(0.3);
      const ok = Math.abs(w.pos.y - D) < 0.1 && tt > 3 && tt < 6; L.push(`the ship's stair climbed in ${tt.toFixed(1)} s (a walk, not a run: 3 to 6 s): ${ok ? 'yes' : 'NO'}`); if (!ok) fail('the stair\'s pace'); }
    const fov0 = camera.fov; at(3.6, D, -5.6); const scope = find(/look through the telescope/); if (scope) { w.sit(scope.seat); run(2); } const zoomed = camera.fov < 15; w.seated = null; run(0.5);
    L.push(`telescope: the view closes in ${zoomed ? 'yes' : 'NO'}, and opens again ${camera.fov === fov0 ? 'yes' : 'NO'}`); if (!zoomed || camera.fov !== fov0) fail('the telescope');
    for (const [re, lx, lz, y] of [[/lie in the net/, 9.0, -5.0, D], [/sit on the rope swing/, -14.8, 6, 0], [/sit in the window seat/, 4.6, -5.6, D], [/take a book/, 3.6, -5.8, D], [/have a biscuit/, 4.2, -5.8, D], [/look at the map/, 3.2, -4.4, D]]) {
      at(lx, y, lz); const it = find(re) ?? ctx.interact.find(i => re.test(i.label?.() ?? '')) ?? (items.seats.find(s => re.test(s.label)) ? { seat: items.seats.find(s => re.test(s.label)) } : null);
      if (!it) { fail('nothing to ' + re.source); continue; }
      if (it.seat) { w.sit(it.seat); run(2); } else it.act?.();
      const cam = camera.position; L.push(`  ${re.source.replace(/\\/g, '')}: ${it.seat ? `seated, eye at (${(cam.x - TX).toFixed(1)}, ${cam.y.toFixed(1)}, ${(cam.z - TZ).toFixed(1)})` : 'done'}`); w.seated = null; run(0.3);
    }
  }

  L.push(errors.length ? 'ERRORS:\n' + [...new Set(errors)].slice(0, 20).join('\n') : 'no errors');
}
out.textContent = L.join('\n');
document.title = 'gardener test done';
} catch (err) { out.textContent = 'FAILED: ' + (err?.stack ?? err) + '\n' + errors.join('\n'); }
</script>
